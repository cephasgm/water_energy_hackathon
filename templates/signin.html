<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Hack the Watts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0b2b3b, #1a4a6f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-card {
            background: rgba(255,255,255,0.95);
            border-radius: 2rem;
            padding: 2rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            color: #1e2a3a;
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1a4a6f;
        }
        .toggle-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .toggle-btn {
            flex: 1;
            padding: 0.7rem;
            background: #e2e8f0;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .toggle-btn.active {
            background: #f39c12;
            color: white;
        }
        .form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        label {
            font-weight: 600;
        }
        input {
            padding: 0.8rem;
            border-radius: 30px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }
        button[type="submit"] {
            background: #f39c12;
            color: #1e2a3a;
            border: none;
            padding: 0.8rem;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: #e67e22;
        }
        .back-home {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-home a {
            color: #1a4a6f;
            text-decoration: none;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="auth-card">
    <h2>⚡💧 Hack the Watts</h2>
    <div class="toggle-buttons">
        <button id="loginTab" class="toggle-btn active">Login</button>
        <button id="signupTab" class="toggle-btn">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm" class="form">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="innovator@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••">
        </div>
        <button id="doLogin">Login</button>
        <div class="message" id="loginMessage"></div>
    </div>

    <!-- Signup Form (hidden initially) -->
    <div id="signupForm" class="form hidden">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="Juma Hassan">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="juma@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="••••••">
        </div>
        <button id="doSignup">Create Account</button>
        <div class="message" id="signupMessage"></div>
    </div>

    <div class="back-home">
        <a href="/">← Back to Home</a>
    </div>
</div>

<script>
    // Tab switching
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const loginFormDiv = document.getElementById('loginForm');
    const signupFormDiv = document.getElementById('signupForm');

    loginTab.addEventListener('click', () => {
        loginTab.classList.add('active');
        signupTab.classList.remove('active');
        loginFormDiv.classList.remove('hidden');
        signupFormDiv.classList.add('hidden');
    });

    signupTab.addEventListener('click', () => {
        signupTab.classList.add('active');
        loginTab.classList.remove('active');
        signupFormDiv.classList.remove('hidden');
        loginFormDiv.classList.add('hidden');
    });

    // Mock login (in real app, send to Flask backend)
    document.getElementById('doLogin').addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value;
        const pwd = document.getElementById('loginPassword').value;
        const msg = document.getElementById('loginMessage');
        if (!email || !pwd) {
            msg.innerText = 'Please fill both fields';
            return;
        }
        // Call Flask login endpoint
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password: pwd})
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = '/dashboard';
        } else {
            msg.innerText = data.message || 'Login failed';
        }
    });

    document.getElementById('doSignup').addEventListener('click', async () => {
        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const pwd = document.getElementById('signupPassword').value;
        const msg = document.getElementById('signupMessage');
        if (!name || !email || !pwd) {
            msg.innerText = 'All fields required';
            return;
        }
        const res = await fetch('/api/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, email, password: pwd})
        });
        const data = await res.json();
        if (data.success) {
            msg.innerText = 'Account created! Please login.';
            // Switch to login tab after 1 sec
            setTimeout(() => {
                loginTab.click();
            }, 1000);
        } else {
            msg.innerText = data.message || 'Signup error';
        }
    });
</script>
</body>
</html>
